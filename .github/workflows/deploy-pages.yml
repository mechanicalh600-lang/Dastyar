name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dastyr-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build historical app
        # This is browser-visible configuration. Supabase publishable keys are
        # intentionally public; privileged/service-role keys must never be added here.
        env:
          VITE_SUPABASE_URL: https://krgznynrljnvxwhvsdxj.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_Y2K2xmx-8VMG0_daOc564w_ZHgRkvt2
        run: npm run build

      - name: Verify dependency audit
        run: npm audit --audit-level=high

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: false
