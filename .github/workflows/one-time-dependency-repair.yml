name: One-time dependency repair

on:
  push:
    branches: [museum-hardening-phase2-20260909]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: museum-hardening-phase2-20260909
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Apply non-breaking dependency security fixes
        run: npm audit fix --package-lock-only
      - name: Install exact dependency graph
        run: npm ci
      - name: Verify production build
        run: npm run build
      - name: Verify dependency audit
        run: npm audit --audit-level=high
      - name: Commit dependency state
        run: |
          if git diff --quiet; then
            echo "No dependency changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: lock and repair dependency graph"
          git push origin HEAD:museum-hardening-phase2-20260909
